<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obrigado | Pizzaria Italia</title>
  <link rel="stylesheet" href="css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#fcfbf8;color:#111;padding-bottom:40px}
    .topbar{background:linear-gradient(135deg,#006437 0%,#00522d 100%);height:62px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,100,55,.28);position:sticky;top:0;z-index:200}
    .topbar-title{color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
    .container{max-width:480px;margin:0 auto;padding:24px 16px;text-align:center}
    .success-card{background:#fff;border-radius:20px;padding:40px 20px;box-shadow:0 4px 20px rgba(0,0,0,.06);margin-bottom:20px}
    .success-icon{width:72px;height:72px;background:#dcfce7;color:#16a34a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px}
    h1{font-size:22px;font-weight:900;color:#006437;margin-bottom:12px}
    p{font-size:14px;color:#4b5563;line-height:1.6;margin-bottom:24px}
    .btn-home{display:inline-block;padding:14px 28px;background:#006437;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;text-decoration:none;box-shadow:0 4px 12px rgba(0,100,55,.2)}
    .btn-home:active{transform:scale(.98)}
  </style>
</head>
<body>
<header class="topbar">
  <div class="topbar-title"><i class="fas fa-check-circle"></i> Pizzaria Italia</div>
</header>

<div class="container">
  <div class="success-card">
    <div class="success-icon"><i class="fas fa-motorcycle"></i></div>
    <h1>Taxa Confirmada!</h1>
    <p>O pagamento da taxa de reentrega foi confirmado com sucesso. Seu pedido foi liberado em nossa central e o entregador está saindo imediatamente para o seu endereço com prioridade máxima.</p>
    <p style="font-weight:700;color:#16a34a;font-size:15px;margin-bottom:0">Previsão de reentrega: 15 a 20 minutos.</p>
  </div>

  <a href="home.html" class="btn-home"><i class="fas fa-home"></i> Ir para a Página Inicial</a>
</div>
</body>
</html>
